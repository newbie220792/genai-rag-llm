version: "3.3"

services:
  embedding-service:
    build:
      context: ./embedding-service
      dockerfile: Dockerfile
    container_name: embedding-service
    ports:
      - "8484:8080"
    environment:
      spring.profiles.active: prod
    networks:
      - rag-network

